---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-controller
# imagePullSecrets:
  # - name: "xxx"
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: test-controller
rules:
  # read-only access to the workload inventory in the current namespace.
  # Deliberately NOT resources: ["*"] -- that would include Secrets.
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
      - endpoints
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  # read-write access to horizontal pod autoscalers in the current namespace
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/
  # https://github.com/kubernetes-client/python/blob/master/kubernetes/README.md
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps.kruise.io"]
    resources: ["*"]
    verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: test-controller
subjects:
  - kind: ServiceAccount
    name: test-controller
roleRef:
  kind: Role
  name: test-controller
  apiGroup: rbac.authorization.k8s.io

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    k8s-app: test-controller
  name: test-controller
rules:
  # Read-only access to the cluster inventory the controller inspects.
  # Deliberately NOT resources: ["*"] (which includes Secrets) and no node
  # mutation: granting node delete/update should be a separate, reviewed step.
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: test-controller
subjects:
  - kind: ServiceAccount
    name: test-controller
    namespace: staging
