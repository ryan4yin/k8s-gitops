---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: k3s-test-1-master-1
spec:
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: m-4vcpu-16gb
  template:
    metadata:
      labels:
        kubevirt.io/vm: k3s-test-1-master-1
    spec:
      volumes:
        - dataVolume:
            name: k3s-test-1-master-1-disk
          name: rootdisk
  dataVolumeTemplates:
    - metadata:
        name: k3s-test-1-master-1-disk
      spec:
        pvc:
          # this is the rootdisk of the node, it contains critical data
          storageClassName: local-path-critical
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          # NOTE: lock down the volume name to avoid creating a new one
          # This should only be used when you want to reuse the volume(like recreating the VM).
          # volumeName: ''
        # clone the golden image (shared NFS store) into the local disk
        source:
          pvc:
            name: golden-k3s-test-1-master-1
            namespace: vms
