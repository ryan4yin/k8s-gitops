kind: will-be-ignored
metadata:
  name: will-be-ignored
spec:
  preference:
    kind: VirtualMachineClusterPreference
    name: virtio
  runStrategy: RerunOnFailure # https://kubevirt.io/user-guide/compute/run_strategies/
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-test-1-worker
    spec:
      affinity:
        podAntiAffinity:
          # Soft anti-affinity: spread the nodes across hosts when possible, but do
          # not block a (re)start when a host still has a terminating pod.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - k3s-test-1-worker
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: defaultnetwork
              masquerade: {}
            - name: bridge-net
              bridge: {}
      networks:
        - name: defaultnetwork
          pod: {}
        - name: bridge-net
          multus:
            # References to a NetworkAttachmentDefinition CRD object
            networkName: bridge-conf
