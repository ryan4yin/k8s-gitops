---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: k3s-test-1-worker-2
spec:
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: standard-4vcpu-16gb-oc50
  template:
    metadata:
      labels:
        kubevirt.io/vm: k3s-test-1-worker-2
    spec:
      nodeSelector:
        kubernetes.io/hostname: kubevirt-shushou
      volumes:
        - dataVolume:
            name: k3s-test-1-worker-2-disk
          name: rootdisk
  dataVolumeTemplates:
    - metadata:
        name: k3s-test-1-worker-2-disk
      spec:
        pvc:
          # this is the rootdisk of the node, it contains critical data
          storageClassName: local-path-critical
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
        # the disk is populated once with `just upload-vm` (a CDI upload)
        source:
          upload: {}
