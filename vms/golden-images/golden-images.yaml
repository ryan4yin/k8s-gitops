# Golden images: the pristine, read-mostly VM disks that new/recreated VMs are
# cloned from. They live on the shared NFS store (nfs-golden) so every node can
# clone them, and are populated out-of-band with `just upload-vm` (CDI upload).
# The VMs' runtime disks stay on local-path (see the VirtualMachine manifests).
#
# Sizes only need to fit the built image (virtualisation.diskSize = "auto", so
# the image is only as large as the data it contains -- currently ~12 GiB for
# kana and ~24 GiB for ruby). The runtime disks are grown to their declared
# size afterwards. The NFS provisioner does not preallocate requests.storage,
# so these numbers are a ceiling, not reserved space.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-aquamarine
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-golden
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-kana
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-golden
  resources:
    requests:
      storage: 16Gi
---
