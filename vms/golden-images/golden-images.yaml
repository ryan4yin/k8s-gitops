# Golden images: the pristine, read-mostly VM disks that new/recreated VMs are
# cloned from. They live on the shared NFS store (nfs-golden) so every node can
# clone them, and are populated out-of-band with `just upload-vm` (a CDI upload).
# The VMs' runtime disks stay on local-path (see the VirtualMachine manifests).
#
# They are declared as DataVolumes with `source.upload` because CDI only accepts
# `virtctl image-upload` into a DataVolume (or a CDI-managed upload PVC); the
# DataVolume creates a PVC of the same name, which the VMs clone via source.pvc.
#
# NOTE: only the k3s-test-1 worker goldens are declared for now, so the `vms`
# health check does not block on the empty upload targets. The other six
# (golden-aquamarine / -kana / -ruby / -k3s-test-1-master-{1,2,3}) are the
# clone sources the *running* VMs already used; add them back once their images
# have been uploaded.
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: golden-k3s-test-1-worker-1
spec:
  source:
    upload: {}
  pvc:
    accessModes:
      - ReadWriteMany
    storageClassName: nfs-golden
    resources:
      requests:
        storage: 32Gi
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: golden-k3s-test-1-worker-2
spec:
  source:
    upload: {}
  pvc:
    accessModes:
      - ReadWriteMany
    storageClassName: nfs-golden
    resources:
      requests:
        storage: 32Gi
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: golden-k3s-test-1-worker-3
spec:
  source:
    upload: {}
  pvc:
    accessModes:
      - ReadWriteMany
    storageClassName: nfs-golden
    resources:
      requests:
        storage: 32Gi
