# Golden images: the pristine, read-mostly VM disks that new/recreated VMs are
# cloned from. They live on the shared NFS store (nfs-golden) so every node can
# clone them, and are populated out-of-band with `just upload-vm` (CDI upload).
# The VMs' runtime disks stay on local-path (see the VirtualMachine manifests).
#
# All goldens use a uniform 32Gi ceiling. The NFS provisioner does not
# preallocate requests.storage, so this is not reserved space: it is a guardrail
# that makes CDI reject an image that outgrows it (both `virtctl image-upload`
# and a source clone require the image to fit the volume). Known image sizes:
# kana ~12 GiB, ruby ~24 GiB; the runtime disks are grown inside the guest.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-aquamarine
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-golden
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-kana
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-golden
  resources:
    requests:
      storage: 32Gi
---
