# Golden images -- kept as a record; no longer used.
#
# We originally provisioned the VMs by uploading a per-VM image once into a
# shared "golden" DataVolume (on the NFS store) and cloning it into each VM's
# local disk via `dataVolumeTemplates.source.pvc`. That indirection only pays off
# when many VMs share one base image; here every VM is an individual NixOS build
# and is only created once, and CDI cannot clone from the NFS class into
# local-path anyway.
#
# The VMs now declare their root disk as `source: upload: {}` and `just upload-vm`
# writes the built image straight into `<vm>-disk` on local-path (no clone, no
# shared store). The NFS store / RWX class is kept for other uses.
#
# Everything below is commented out as a record of what we used.
#
# ---
# apiVersion: cdi.kubevirt.io/v1beta1
# kind: DataVolume
# metadata:
#   name: golden-aquamarine
# spec:
#   source:
#     upload: {}
#   pvc:
#     accessModes:
#       - ReadWriteMany
#     storageClassName: nfs-golden
#     resources:
#       requests:
#         storage: 32Gi
