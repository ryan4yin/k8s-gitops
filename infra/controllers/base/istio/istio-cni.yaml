# https://fluxcd.io/flux/components/helm/helmreleases/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  releaseName: istio-cni
  interval: 30m
  chart:
    spec:
      chart: cni
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 12h
      version: "1.30.4"
  values:
    profile: ambient
    # https://istio.io/latest/docs/ambient/install/platform-prerequisites/#k3s
    global:
      platform: k3s
      # The native nftables backend hits an upstream bug on k3s (istio#61078):
      # its kubelet UID detection only matches processes named `kubelet` or
      # `kubelite`, but k3s embeds kubelet in the `k3s` process, so the CNI node
      # agent crashloops ("error initializing the host rules for health checks")
      # and the ambient stack never comes up. The fix (accept `k3s`) is merged
      # upstream but not in a release yet, so use the iptables backend.
      nativeNftables: false
