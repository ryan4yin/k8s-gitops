# NOTE: `egressDeny` flips selected endpoints to default-deny egress; the
# allow-all `egress` rule below restores it, with the deny layered on top.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pod-to-node-admin-ports
spec:
  description: Deny pod egress to sensitive host services on cluster nodes.
  endpointSelector: {}
  egress:
    - toEntities:
        - all
  egressDeny:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "2049"
              protocol: TCP
            - port: "2283"
              protocol: TCP
            - port: "5432"
              protocol: TCP
            - port: "5900"
              protocol: TCP
            - port: "5901"
              protocol: TCP
            - port: "5902"
              protocol: TCP
            - port: "5903"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9633"
              protocol: TCP
            - port: "9835"
              protocol: TCP
