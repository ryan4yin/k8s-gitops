kind: will-be-ignored
metadata:
  name: will-be-ignored
spec:
  values:
    # K3s embeds these components in its server process, so the chart's Pod
    # selectors cannot discover them. Scrape the three server nodes directly.
    kubeControllerManager:
      endpoints: [192.168.5.114, 192.168.5.115, 192.168.5.116]
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                # K3s signs these listener certificates for localhost, not the node IP.
                serverName: localhost
    kubeScheduler:
      endpoints: [192.168.5.114, 192.168.5.115, 192.168.5.116]
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                # K3s signs these listener certificates for localhost, not the node IP.
                serverName: localhost
    kubeEtcd:
      endpoints: [192.168.5.114, 192.168.5.115, 192.168.5.116]
      service:
        # K3s exposes the unauthenticated etcd metrics endpoint on 2381; 2379 is the client API.
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    vmagent:
      spec:
        scrapeInterval: 20s
        externalLabels:
          # For multi-cluster setups it is useful to use "cluster" label to identify the metrics source.
          cluster: k3s-test-1
          env: test
      ingress:
        hosts:
          - test1-vmagent.writefor.fun
