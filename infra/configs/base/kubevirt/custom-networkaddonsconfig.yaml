---
apiVersion: networkaddonsoperator.network.kubevirt.io/v1alpha1
kind: NetworkAddonsConfig
metadata:
  name: cluster
spec:
  imagePullPolicy: IfNotPresent
  # kubeMacPool: {}
  # kubeSecondaryDNS: {}
  # kubevirtIpamController: {}
  # linuxBridge: {}
  # macvtap: {}
  ovs: {} # openvswitch cni plugin
  multus: {} # required by ovs-cni
  # disabled: the dynamic-networks-controller hardcodes the CRI-O socket
  # (/run/crio/crio.sock) and cannot start on k3s; we don't hot-plug networks.
  # multusDynamicNetworks: {}
