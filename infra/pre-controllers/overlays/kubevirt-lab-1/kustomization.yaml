---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kubevip/
  - ../../base/cilium/
  # csi-driver-nfs backs the shared golden-image store (nfs-golden StorageClass)
  - ../../base/csi-driver-nfs/
  # plain ca-certs only: the base secrets also ship a SOPS-encrypted
  # server-tls-certs which this cluster's sops-age key cannot decrypt.
  - ./secrets/
