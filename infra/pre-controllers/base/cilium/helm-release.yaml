# https://fluxcd.io/flux/components/helm/helmreleases/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  interval: 30m
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
      # Review CNI upgrades before changing the version used by the cluster.
      version: "1.20.2"
  values:
    # ======================== Work with Istio ========================
    # https://docs.cilium.io/en/stable/network/servicemesh/istio/
    cni:
      exclusive: false
    socketLB:
      hostNamespaceOnly: true
    # disable L7 Proxy
    l7Proxy: false

    # ============================  Dual Stack  ============================
    ipv6:
      enabled: true
    # -- Enables masquerading of IPv6 traffic leaving the node from endpoints.
    enableIPv6Masquerade: true
