# https://fluxcd.io/flux/components/helm/helmreleases/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  interval: 30m
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
      # Review CNI upgrades before changing the version used by the cluster.
      version: "1.20.2"
  values:
    # ======================== Work with Istio ========================
    # https://docs.cilium.io/en/stable/network/servicemesh/istio/
    cni:
      exclusive: false
    socketLB:
      hostNamespaceOnly: true
    # disable L7 Proxy
    l7Proxy: false

    # eBPF datapath; requires k3s --disable-kube-proxy (nix-config#404).
    kubeProxyReplacement: "true"
    bpf:
      masquerade: true
    # must match k3s --service-node-port-range; Cilium wants "min,max"
    nodePort:
      range: "80,32767"
    # DNS name, not VIP IP: the API cert SANs omit the VIP IP.
    k8sServiceHost: test-cluster-1.writefor.fun
    k8sServicePort: 6443

    # ============================  Dual Stack  ============================
    ipv6:
      enabled: true
    # -- Enables masquerading of IPv6 traffic leaving the node from endpoints.
    enableIPv6Masquerade: true
