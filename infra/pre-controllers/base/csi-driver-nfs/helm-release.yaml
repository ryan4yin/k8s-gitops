# NFS CSI driver. The golden-image store is served by an NFS export on
# kubevirt-youko (see the nix-config host module), and this driver turns its
# subdirectories into RWX PersistentVolumes that every node can mount.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  releaseName: csi-driver-nfs
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      interval: 12h
      version: "4.*"
  install:
    createNamespace: false
  values:
    # The nfs-golden StorageClass is managed in infra/configs/base/storageclasses.
    storageClass:
      create: false
