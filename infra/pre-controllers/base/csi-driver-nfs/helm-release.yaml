# NFS CSI driver. The golden-image store is served by an NFS export on
# kubevirt-youko (see the nix-config host module), and this driver turns its
# subdirectories into RWX PersistentVolumes that every node can mount.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  releaseName: csi-driver-nfs
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      interval: 12h
      version: "4.*"
  # The chart installs a controller Deployment plus a per-node DaemonSet. Give
  # the Helm client room so its request rate limiter does not trip the action
  # deadline, and retry transient install failures (Flux defaults to no retry).
  timeout: 10m
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    # The nfs-golden StorageClass is managed in infra/configs/base/storageclasses.
    storageClass:
      create: false
    # The k3s-test control-plane nodes are tainted, but the node plugin (which
    # mounts/unmounts NFS) must run on every node.
    node:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
