# kube-vip provides the HA virtual IP for the k3s API server, replacing servicelb
# (which the nix-config k3s module disables). The VIP comes from the dedicated
# 192.168.5.192/27 block reserved in nix-config; k3s-test-1 uses 192.168.5.193.
#
# ARP mode: the leader master answers ARP for the VIP on its LAN interface
# (enp0s6, the guest's virtio NIC attached to br0), so clients reach the API over
# the same 192.168.5.0/24 as the nodes. `--taint` keeps kube-vip on the masters.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  releaseName: kube-vip
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
      interval: 12h
      version: "0.11.*"
  # Give the Helm client room so its request rate limiter does not trip the
  # action deadline, and retry transient install failures (Flux defaults to no
  # retry).
  timeout: 10m
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    # control-plane VIP, from the reserved k8s VIP block
    config:
      address: "192.168.5.193"
    # kube-vip v1.x detects the in-cluster config from the pod's ServiceAccount
    # (the `--inCluster`/`--taint` flags are gone). Confine it to the
    # control-plane nodes.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/master
                  operator: Exists
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    env:
      vip_arp: "true"
      # the guest's virtio NIC; all three masters use the same name
      vip_interface: "enp0s6"
      vip_subnet: "32"
      cp_enable: "true"
      cp_namespace: "kube-system"
      vip_leaderelection: "true"
      vip_leaseduration: "5"
      vip_renewdeadline: "3"
      vip_retryperiod: "1"
      # kube-vip also replaces servicelb for Service type=LoadBalancer
      svc_enable: "true"
      lb_enable: "true"
      lb_port: "6443"
