# kube-vip provides the HA control-plane VIP and Service type=LoadBalancer
# addresses from the reserved 192.168.5.192/27 block (k3s-test-1 uses
# 192.168.5.193 for the API and hands the rest to services).
#
# API endpoint: kube-vip must not reach the apiserver through the ClusterIP.
# After a full cold start the ClusterIP only exists once Cilium runs, and
# Cilium's own bootstrap needs this VIP — a deadlock (nix-config
# WORKAROUNDS.md WA-043). Each pod therefore talks to its own node's apiserver
# (`KUBERNETES_SERVICE_HOST` = status.hostIP, port 6443), which k3s serves
# locally without any CNI.
#
# ARP mode: the leader master answers ARP for each address on its LAN interface
# (enp0s6, the guest's virtio NIC attached to br0).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  releaseName: kube-vip
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
      interval: 12h
      version: "0.11.1"
  # Give the Helm client room so its request rate limiter does not trip the
  # action deadline, and retry transient install failures (Flux defaults to no
  # retry).
  timeout: 10m
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    # control-plane VIP, from the reserved k8s VIP block
    config:
      address: "192.168.5.193"
    # kube-vip v1.x detects the in-cluster config from the pod's ServiceAccount
    # (the `--inCluster`/`--taint` flags are gone). Confine it to the
    # control-plane nodes.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/master
                  operator: Exists
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    env:
      vip_arp: "true"
      # the guest's virtio NIC; all three masters use the same name
      vip_interface: "enp0s6"
      vip_subnet: "32"
      # kube-vip runs with hostNetwork, and the kubelet honours pod-spec env over
      # the injected service variables: this keeps its API client on the local
      # apiserver instead of the ClusterIP.
      KUBERNETES_SERVICE_PORT: "6443"
      cp_enable: "true"
      cp_namespace: "kube-system"
      vip_leaderelection: "true"
      vip_leaseduration: "5"
      vip_renewdeadline: "3"
      vip_retryperiod: "1"
      # kube-vip also replaces servicelb for Service type=LoadBalancer
      svc_enable: "true"
      lb_enable: "true"
      lb_port: "6443"
    envValueFrom:
      KUBERNETES_SERVICE_HOST:
        fieldRef:
          # every pod takes its own node's address, so no VIP is needed for the
          # API client during a cold start
          fieldPath: status.hostIP
